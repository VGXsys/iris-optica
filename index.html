<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>ÍRIS — Óptica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   ÍRIS — ÓPTICA
   Direção: catálogo real, sem afetação. Papel branco, tinta preta,
   cinzas neutros — nenhuma outra cor. Serifa de vitrine + sans limpa.
   ═══════════════════════════════════════════════════════════ */
:root{
  --void:#0A0A0A;
  --ink:#121212;
  --ink-2:#1E1E1E;
  --ink-3:#2A2A2A;
  --paper:#FFFFFF;
  --paper-2:#F4F4F3;
  --cloud:#FFFFFF;
  --stone:#6B6B6B;
  --fog:#A3A3A3;
  --line:#E3E3E1;
  --line-dark:rgba(255,255,255,.14);
  --r:14px;--r-sm:10px;--r-lg:22px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 16px 40px rgba(0,0,0,.08);
  --shadow-dark:0 26px 64px rgba(0,0,0,.5);
  --display:"Fraunces",Georgia,serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,"Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html.tab-hidden *{animation-play-state:paused!important}
.v360,.tryband,footer{content-visibility:auto;contain-intrinsic-size:1px 900px}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);background:var(--paper);color:var(--ink);
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:#fff}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

/* ═══════════ VITRINE DE FOTO (arraste = gira entre os ângulos reais) ═══════════ */
.pspin{position:relative;width:100%;height:100%;display:grid;place-items:center;cursor:grab;touch-action:pan-y;user-select:none}
.pspin.grabbing{cursor:grabbing}
.pimg{width:86%;height:86%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 20px 22px rgba(0,0,0,.12))}

/* ═══════════ LOADER ═══════════ */
.loader{
  position:fixed;inset:0;z-index:9999;background:var(--paper);
  display:grid;place-items:center;transition:opacity .7s var(--ease),visibility .7s;
}
.loader.done{opacity:0;visibility:hidden}
.iris{position:relative;width:70px;height:70px}
.iris .blade{
  position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--ink);animation:irisSpin 1s var(--ease-io) infinite;
}
@keyframes irisSpin{to{transform:rotate(360deg)}}
.loader .lbl{
  position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--stone);text-transform:uppercase;white-space:nowrap;
}

/* ═══════════ NAV ═══════════ */
.nav-wrap{position:fixed;top:0;left:0;right:0;z-index:70;transition:transform .5s var(--ease)}
.nav-wrap.hide{transform:translateY(-110%)}
.nav{
  max-width:1280px;margin:14px auto;padding:11px 16px;
  display:flex;align-items:center;gap:16px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:100px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .eye{width:28px;height:28px;border-radius:50%;flex-shrink:0;position:relative;border:2px solid var(--ink)}
.brand .eye::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ink)}
.brand .nm{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:4px;line-height:1}
.nav .links{display:flex;gap:4px;margin-left:8px}
.nav .links a{
  padding:8px 15px;border-radius:100px;font-size:13.5px;font-weight:500;color:var(--stone);
  transition:color .2s,background .2s;
}
.nav .links a:hover{color:var(--ink);background:rgba(0,0,0,.05)}
.nav .acts{display:flex;align-items:center;gap:6px;margin-left:auto}
.ibtn{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  position:relative;transition:background .2s,transform .2s;
}
.ibtn:hover{background:rgba(0,0,0,.06);transform:translateY(-2px)}
.ibtn svg{width:19px;height:19px}
.ibtn .cnt{
  position:absolute;top:1px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--ink);color:var(--paper);font-size:10.5px;font-weight:700;
  display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--ease);font-family:var(--mono);
}
.ibtn .cnt.on{transform:scale(1)}
.nav .cta-try{
  padding:10px 19px;border-radius:100px;font-size:13.5px;font-weight:600;color:var(--paper);
  background:var(--ink);display:flex;align-items:center;gap:8px;transition:background .25s,transform .2s;
}
.nav .cta-try:hover{background:var(--ink-2);transform:translateY(-2px)}
.nav .cta-try svg{width:16px;height:16px}

/* ═══════════ HERO ═══════════ */
.hero{
  position:relative;min-height:100svh;display:grid;place-items:center;
  padding:110px 20px 60px;overflow:hidden;background:var(--paper);
}
.hero-in{
  position:relative;z-index:2;max-width:1280px;width:100%;
  display:grid;grid-template-columns:1.02fr .98fr;gap:40px;align-items:center;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);
  font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:var(--stone);
  border:1px solid var(--line);padding:7px 15px;border-radius:100px;
}
.eyebrow .pip{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pip 2.4s ease-in-out infinite}
@keyframes pip{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(18,18,18,.3)}50%{opacity:.5;box-shadow:0 0 0 7px rgba(18,18,18,0)}}
h1.mega{
  font-family:var(--display);font-weight:600;font-optical-sizing:auto;
  font-size:clamp(42px,7vw,84px);line-height:.98;letter-spacing:-1.5px;margin:22px 0 0;
}
h1.mega .ln{display:block;overflow:hidden}
h1.mega .ln i{display:block;font-style:italic;font-weight:400;transform:translateY(105%);animation:riseUp 1s var(--ease) forwards}
h1.mega .ln:nth-child(1) i{font-style:normal;font-weight:600}
h1.mega .ln:nth-child(2) i{animation-delay:.1s}
h1.mega .ln:nth-child(3) i{animation-delay:.2s}
@keyframes riseUp{to{transform:translateY(0)}}
.grad-txt{font-style:italic;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px;text-decoration-color:var(--line)}
.hero p.sub{
  color:var(--stone);font-size:clamp(15px,1.5vw,17px);max-width:470px;margin-top:22px;font-weight:400;
}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:15px 26px;border-radius:100px;font-weight:600;font-size:14.5px;
  transition:transform .25s var(--ease),box-shadow .3s,background .25s,border-color .3s,color .25s;
}
.btn-spec{color:var(--paper);background:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.16)}
.btn-spec:hover{background:var(--ink-2);transform:translateY(-3px);box-shadow:0 16px 38px rgba(0,0,0,.22)}
.btn-line{border:1px solid var(--line);color:var(--ink);background:transparent}
.btn-line:hover{border-color:var(--ink);background:rgba(0,0,0,.03);transform:translateY(-3px)}
.btn svg{width:18px;height:18px}
.hero-meta{display:flex;gap:30px;margin-top:40px;flex-wrap:wrap}
.hero-meta .m b{font-family:var(--display);font-size:29px;font-weight:600;display:block;line-height:1}
.hero-meta .m span{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:var(--stone);text-transform:uppercase}

.hero-stage{position:relative;aspect-ratio:1/1;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 50%,var(--paper-2),transparent 72%);border-radius:var(--r-lg)}
.hero-stage .hero-tag{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;
  font-family:var(--mono);font-size:10px;letter-spacing:2.4px;color:var(--stone);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
.hero-stage .hero-tag svg{width:14px;height:14px}
.hero-scroll{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:3;
  font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--stone);
  display:flex;flex-direction:column;align-items:center;gap:9px;text-transform:uppercase;
}
.hero-scroll .bar{width:1px;height:40px;background:linear-gradient(var(--stone),transparent);animation:scrollBar 2.2s ease-in-out infinite}
@keyframes scrollBar{0%,100%{transform:scaleY(.35);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* ═══════════ MARQUEE ═══════════ */
.marq{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  overflow:hidden;padding:15px 0;background:var(--paper-2);position:relative;z-index:4;
}
.marq .track{display:flex;gap:44px;width:max-content;animation:marq 36s linear infinite}
.marq:hover .track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.marq .it{
  display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:500;font-style:italic;
  font-size:16px;letter-spacing:.2px;color:var(--stone);white-space:nowrap;
}
.marq .it .dot{width:5px;height:5px;border-radius:50%;background:var(--ink)}

/* ═══════════ SEÇÕES ═══════════ */
.light{background:var(--paper);color:var(--ink);position:relative;z-index:4}
.sec{max-width:1280px;margin:0 auto;padding:88px 20px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.kick{
  font-family:var(--mono);font-size:11px;letter-spacing:3.5px;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:9px;color:var(--stone);
}
.kick .ln{width:36px;height:1px;background:var(--ink)}
.v360 .kick .ln,.tryband .kick .ln{background:var(--fog)}
.sec h2{
  font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,50px);
  line-height:1.02;letter-spacing:-1px;margin-top:14px;
}
.sec .lead{color:var(--stone);font-size:15.5px;max-width:520px;margin-top:14px}

.filters{display:flex;gap:9px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fpill{
  white-space:nowrap;padding:10px 20px;border-radius:100px;font-size:13.5px;font-weight:600;
  background:transparent;border:1px solid var(--line);color:var(--stone);transition:.25s var(--ease);
}
.fpill:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px)}
.fpill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ═══════════ GRID DE PRODUTOS ═══════════ */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:26px}
.card{
  background:var(--cloud);border-radius:var(--r-lg);overflow:hidden;position:relative;
  display:flex;flex-direction:column;border:1px solid var(--line);
  transition:box-shadow .4s,transform .18s ease-out,border-color .3s;
}
.card:hover{box-shadow:var(--shadow);border-color:transparent}
.card .stage{
  aspect-ratio:1/.84;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--paper-2);
}
.card .tag{
  position:absolute;top:13px;left:13px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;
  text-transform:uppercase;padding:6px 11px;border-radius:100px;font-weight:700;
  background:var(--ink);color:var(--paper);z-index:3;
}
.card .try-fab{
  position:absolute;top:11px;right:11px;width:38px;height:38px;border-radius:50%;z-index:3;
  background:rgba(255,255,255,.92);backdrop-filter:blur(6px);color:var(--ink);
  display:grid;place-items:center;box-shadow:var(--shadow);
  opacity:0;transform:scale(.6) rotate(-30deg);transition:.35s var(--ease);
}
.card:hover .try-fab{opacity:1;transform:scale(1) rotate(0)}
.card .try-fab:hover{background:var(--ink);color:var(--paper)}
.card .try-fab svg{width:18px;height:18px}
.card .body{padding:17px 18px 18px;display:flex;flex-direction:column;flex:1;gap:4px}
.card .house{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);font-weight:700}
.card h3{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.2px;line-height:1.15}
.card .spec{font-family:var(--mono);font-size:10.5px;color:var(--stone);letter-spacing:.4px;margin-top:3px}
.card .foot{margin-top:12px;padding-top:14px;display:flex;align-items:flex-end;gap:10px;border-top:1px solid var(--line)}
.card .price{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.3px}
.card .inst{font-family:var(--mono);font-size:9.5px;color:var(--stone);margin-left:auto;text-align:right;line-height:1.4}
.card .pick{
  margin:0 18px 18px;padding:13px;border-radius:100px;font-weight:600;font-size:14px;
  background:var(--paper-2);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;
  transition:.3s var(--ease);position:relative;overflow:hidden;
}
.card .pick span{position:relative;z-index:2}
.card .pick svg{position:relative;z-index:2;width:16px;height:16px}
.card .pick::before{
  content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .4s var(--ease);
}
.card .pick:hover{color:var(--paper)}
.card .pick:hover::before{transform:translateY(0)}

/* ═══════════ VISUALIZADOR 360 ═══════════ */
.v360{background:var(--ink);position:relative;overflow:hidden;z-index:4}
.v360-in{position:relative;max-width:1280px;margin:0 auto;padding:88px 20px;display:grid;grid-template-columns:.85fr 1.15fr;gap:44px;align-items:center}
.v360 .kick{color:var(--fog)}
.v360 h2{color:var(--paper)}
.v360 .lead{color:var(--fog)}
.v360-stage{
  position:relative;aspect-ratio:1/.78;border-radius:var(--r-lg);
  background:rgba(255,255,255,.03);
  border:1px solid var(--line-dark);display:grid;place-items:center;overflow:hidden;
}
.v360-stage .hint{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;letter-spacing:2.4px;color:var(--fog);text-transform:uppercase;
  display:flex;align-items:center;gap:9px;transition:opacity .4s;
}
.v360-stage .hint svg{width:15px;height:15px;animation:swipeHint 2s ease-in-out infinite}
@keyframes swipeHint{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.v360-stage.touched .hint{opacity:0}
.deg-read{
  position:absolute;top:16px;right:18px;font-family:var(--mono);font-size:11px;
  color:var(--paper);letter-spacing:1.5px;background:rgba(255,255,255,.08);
  border:1px solid var(--line-dark);padding:5px 12px;border-radius:100px;
}
.v360-tools{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap;align-items:center}
.chip360{
  padding:9px 15px;border-radius:100px;border:1px solid var(--line-dark);
  font-size:12.5px;font-weight:600;color:var(--fog);transition:.25s;
  display:flex;align-items:center;gap:7px;
}
.chip360:hover{border-color:var(--paper);color:var(--paper)}
.chip360.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chip360 svg{width:14px;height:14px}

/* ═══════════ LENTES ═══════════ */
.lens-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:30px}
.lens-card{
  background:var(--cloud);border-radius:var(--r);padding:24px 20px;position:relative;overflow:hidden;
  border:1px solid var(--line);transition:.4s var(--ease);
}
.lens-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:transparent}
.lens-card .ic{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin-bottom:16px;
  background:var(--paper-2);color:var(--ink);transition:.4s var(--ease);
}
.lens-card:hover .ic{background:var(--ink);color:var(--paper);transform:rotate(-6deg) scale(1.05)}
.lens-card .ic svg{width:24px;height:24px}
.lens-card h4{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.1px}
.lens-card p{font-size:13px;color:var(--stone);margin-top:7px;line-height:1.5}
.lens-card .val{
  font-family:var(--mono);font-size:12px;font-weight:700;margin-top:14px;display:inline-block;
  padding:5px 12px;border-radius:100px;background:var(--paper-2);color:var(--ink);
}
.lens-card .val.free{background:var(--ink);color:var(--paper)}

/* ═══════════ CTA PROVADOR ═══════════ */
.tryband{position:relative;overflow:hidden;background:var(--ink);z-index:4}
.tryband-in{
  position:relative;max-width:1280px;margin:0 auto;padding:78px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;
}
.tryband h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.8px;line-height:1.02;color:var(--paper)}
.tryband p{color:var(--fog);margin-top:14px;max-width:520px;font-size:15px}
.tryband .btn-spec{background:var(--paper);color:var(--ink)}
.tryband .btn-spec:hover{background:var(--fog)}

/* ═══════════ FOOTER ═══════════ */
footer{background:var(--void);position:relative;z-index:4;border-top:1px solid var(--line-dark);color:var(--paper)}
.foot{max-width:1280px;margin:0 auto;padding:64px 20px 28px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:34px}
.foot h5{font-family:var(--mono);font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--fog);margin-bottom:16px}
.foot a{display:block;font-size:13.5px;color:var(--fog);margin-bottom:11px;transition:.25s;width:fit-content}
.foot a:hover{color:var(--paper);transform:translateX(4px)}
.foot .about{color:var(--fog);font-size:13.5px;max-width:290px;margin-top:16px;line-height:1.65}
.foot-end{
  border-top:1px solid var(--line-dark);padding:18px 20px;text-align:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--fog);
}
.foot-end b{color:var(--paper)}

/* ═══════════ REVEAL ON SCROLL ═══════════ */
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv-d1{transition-delay:.08s}.rv-d2{transition-delay:.16s}.rv-d3{transition-delay:.24s}.rv-d4{transition-delay:.32s}

/* ═══════════ OVERLAY / DRAWER / MODAL ═══════════ */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.6);backdrop-filter:blur(6px);z-index:90;opacity:0;visibility:hidden;transition:.4s var(--ease)}
.ov.on{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(440px,100%);z-index:100;
  background:var(--paper);color:var(--ink);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .55s var(--ease);box-shadow:var(--shadow-dark);
}
.drawer.on{transform:none}
.dr-head{padding:22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.dr-head h3{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.3px}
.xbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:.25s}
.xbtn:hover{background:rgba(0,0,0,.06);transform:rotate(90deg)}
.xbtn svg{width:19px;height:19px}
.dr-body{flex:1;overflow-y:auto;padding:8px 22px}
.ci{display:flex;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}

/* modal de configuração */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:.4s var(--ease)}

.mcard{
  width:min(940px,100%);max-height:93vh;border-radius:var(--r-lg);overflow:hidden;
  background:var(--paper);color:var(--ink);display:grid;grid-template-columns:.92fr 1.08fr;
  transform:scale(.94) translateY(18px);transition:transform .5s var(--ease);box-shadow:var(--shadow-dark);
}

.m-vis{position:relative;background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;overflow:hidden}

.m-vis .mtry{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;
  padding:10px 18px;border-radius:100px;background:var(--ink);
  color:var(--paper);font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:8px;transition:.3s;white-space:nowrap;
}

.m-cfg{padding:26px;overflow-y:auto;display:flex;flex-direction:column}

.m-cfg h3{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:-.5px;margin-top:5px;line-height:1.06}
.m-cfg .mdesc{font-size:13.5px;color:var(--stone);margin-top:10px}
.blk{margin-top:22px}
.blk .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:11px;color:var(--ink)}

.eyes{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.m-foot{margin-top:auto;padding-top:22px}

.t-empty .bic svg{width:42px;height:42px;color:var(--paper);position:relative;z-index:2}

.t-up{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.t-status{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:6;
  background:rgba(10,10,10,.92);border:1px solid var(--line-dark);color:var(--paper);
  font-family:var(--mono);font-size:11px;letter-spacing:1.2px;padding:9px 17px;border-radius:100px;
  display:none;align-items:center;gap:9px;backdrop-filter:blur(8px);
}
.t-status.on{display:flex}

.t-frames{display:flex;gap:11px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}

  flex-shrink:0;width:104px;border-radius:16px;padding:11px 9px;cursor:pointer;text-align:center;

.cam-mask{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-ring{
  position:absolute;left:50%;top:45%;width:52%;height:66%;transform:translate(-50%,-50%);
  border-radius:50%;border:2px solid var(--fog);transition:border-color .25s,box-shadow .25s;pointer-events:none;

  width:52px;height:52px;border-radius:50%;background:var(--paper);color:var(--ink);

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);z-index:200;
  background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:100px;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-dark);opacity:0;transition:.45s var(--ease);
}
.toast.on{transform:translateX(-50%);opacity:1}

/* Sincroniza o catálogo com a tabela `armacoes` do Supabase, se disponível.
   PRODUTOS continua com os dados locais acima até (e a menos que) o banco
   responda — o array é mutado no próprio lugar (não reatribuído) pra que
   todo o código que já referencia PRODUTOS enxergue a atualização. As
   fotos continuam vindo de produtos/<id>/N.png (arquivos do próprio site),
   o banco só guarda quantas fotos (n_fotos) e qual é a capa. */
async function syncCatalogoRemoto(){
  if(!sb)return;
  try{
    const {data,error} = await sb.from("armacoes").select("*").eq("ativo",true).order("ordem",{ascending:true});
    if(error||!data||!data.length)return;
    PRODUTOS.length=0;
    data.forEach(r=>PRODUTOS.push({
      id:r.id,nome:r.nome,marca:r.marca,shape:r.shape,cor:r.cor,mat:r.mat||"",
      preco:+r.preco,tag:r.tag||"",desc:r.descricao||"",n:+r.n_fotos||1,capa:+r.capa||1,
    }));
    renderFilters(); renderGrid();
    refreshV360Data();
    if(T.prod){ T.prod=PRODUTOS.find(p=>p.id===T.prod.id)||PRODUTOS[0]; drawChips(); if(T.mode==="photo")repaint(); }
  }catch(e){ /* mantém o catálogo local — o site segue funcionando normal */ }
}

/* ═══════════ VITRINE POR FOTO — arraste = avança/recua nos ângulos reais ═══════════ */
function makePhotoSpin(el,prod,startIdx){
  if(!el||!prod)return;
  const img=el.querySelector(".pimg"); if(!img)return;
  const total=prod.n||1;
  let idx=((startIdx??(prod.capa-1))%total+total)%total;
  el._setIdx = i => { idx=((i%total)+total)%total; img.src=fotoUrl(prod,idx+1); return idx; };
  if(el.dataset.spinBound)return;
  el.dataset.spinBound="1";
  let dragging=false,lastX=0,acc=0,moved=0;
  const STEP=20;
  const start=e=>{ dragging=true;moved=0;acc=0; lastX=(e.touches?e.touches[0]:e).clientX; el.classList.add("grabbing"); };
  const move=e=>{
    if(!dragging)return;
    const x=(e.touches?e.touches[0]:e).clientX;
    const dx=x-lastX; lastX=x; moved+=Math.abs(dx); acc+=dx;
    while(acc>STEP){ el._setIdx(idx-1); acc-=STEP; }
    while(acc<-STEP){ el._setIdx(idx+1); acc+=STEP; }
    if(e.cancelable)e.preventDefault();
  };
  const end=()=>{ dragging=false; el.classList.remove("grabbing"); el.dataset.moved=moved>6?"1":""; };
  el.addEventListener("mousedown",start);
  el.addEventListener("touchstart",start,{passive:true});
  window.addEventListener("mousemove",move);
  window.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",end);
  window.addEventListener("touchend",end);
}

  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openCfg(b.dataset.open));
  el.querySelectorAll("[data-try]").forEach(b=>b.onclick=e=>{e.stopPropagation();openTry(b.dataset.try);});
  el.querySelectorAll(".card .stage").forEach(s=>{
    const scene=s.querySelector("[data-pid]");
    const p=PRODUTOS.find(x=>x.id===scene.dataset.pid);
    makePhotoSpin(scene,p);
    s.onclick=e=>{
      if(e.target.closest("[data-try]"))return;
      if(scene&&scene.dataset.moved){scene.dataset.moved="";return;}
      openCfg(s.closest(".card").dataset.id);
    };
  });
  tiltCards();
  observeReveal();
}

/* inclinação 3D dos cards seguindo o cursor */
function tiltCards(){
  if(matchMedia("(pointer:coarse)").matches) return;
  document.querySelectorAll(".card").forEach(c=>{
    c.onmousemove=e=>{
      const r=c.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
      c.style.transform=`perspective(900px) rotateY(${px*5}deg) rotateX(${-py*5}deg) translateY(-4px)`;
    };
    c.onmouseleave=()=>{c.style.transform="";};
  });
}

function checkout(){
  if(!cart.length)return;
  let m=`*${CONFIG.loja}* — novo pedido\n\n`;
  cart.forEach(i=>{m+=`▫ ${i.qty}x ${i.marca} ${i.nome}\n   Lente: ${i.lente}\n   ${i.grau}\n   ${BRL(i.preco*i.qty)}\n\n`;});
  const t=totalCart(), frete=t>=CONFIG.freteGratis;
  m+=`*Total:* ${BRL(t)}\n*Parcelamento:* ${CONFIG.parcelas}x de ${BRL(t/CONFIG.parcelas)} sem juros\n`;
  m+=`*Frete:* ${frete?"grátis":"a combinar"}\n\n_Aguardo confirmação e dados de entrega._`;
  registrarPedido(t,frete);
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(m)}`,"_blank");
}
/* Grava o pedido no Supabase antes de abrir o WhatsApp — só pra ficar
   registrado no banco também. Não bloqueia o checkout: se o banco não
   responder, o WhatsApp abre normalmente do mesmo jeito. */
function registrarPedido(total,frete){
  if(!sb)return;
  sb.from("pedidos").insert({itens:cart,total,frete_gratis:frete,canal:"whatsapp"})
    .then(({error})=>{ if(error) console.warn("Não foi possível registrar o pedido no Supabase:",error.message); });
}

/* ═══════════ PROVADOR VIRTUAL ═══════════
   Fluxo: enviar foto (detecção automática) OU ligar câmera —
   a câmera mostra um guia oval; o rosto precisa se encaixar nele
   para a foto ser tirada sozinha, no ângulo certo. Isso evita o
   problema de fotos mal enquadradas em que o óculos não encaixava.
   O que é desenhado sobre o rosto é um contorno vetorial simples
   (frameSVGflat), não a foto do produto — a foto real fica na vitrine. */
const T={on:false,mode:null,img:null,video:null,stream:null,fm:null,auto:true,
         prod:null,t:{cx:.5,cy:.42,scale:.42,rot:0},raf:null,holdStart:0};
function openTry(id){
  T.prod=id?PRODUTOS.find(p=>p.id===id):PRODUTOS[0];
  document.getElementById("tryOn").classList.add("on");
  document.body.classList.add("locked"); T.on=true;
  drawChips();
  if(!T.img&&!T.stream) emptyTry(); else loopDraw();
}
function closeTry(){
  document.getElementById("tryOn").classList.remove("on");
  document.body.classList.remove("locked"); T.on=false; T.mode=null;
  stopCam(); cancelAnimationFrame(T.raf);
}
function stopCam(){ if(T.stream){T.stream.getTracks().forEach(t=>t.stop());T.stream=null;} }
function emptyTry(){
  document.getElementById("tryStage").innerHTML=`
    <div class="t-empty">
      <div class="bic">${IC.face}</div>
      <h3>Põe a armação no seu rosto</h3>
      <p>Manda uma selfie de frente com boa luz, ou ligue a câmera: um guia mostra exatamente onde encaixar o rosto e a foto é tirada sozinha, no ângulo certo.</p>
      <div class="t-up">
        <button class="btn btn-spec" id="upBtn">${IC.up} Enviar foto</button>
        <button class="btn btn-line" id="camBtn" style="border-color:var(--line-dark);color:var(--paper)">${IC.cam} Usar câmera</button>
      </div>
      <input type="file" id="tryFile" accept="image/*" hidden>
    </div>`;
  document.getElementById("upBtn").onclick=()=>document.getElementById("tryFile").click();
  document.getElementById("tryFile").onchange=onFile;
  document.getElementById("camBtn").onclick=startCam;
  document.getElementById("tryCtrl").style.display="none";
}
function onFile(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{const i=new Image();i.onload=()=>{stopCam();T.img=i;T.video=null;T.mode="photo";T.auto=true;setStage();detectPhoto();};i.src=ev.target.result;};
  r.readAsDataURL(f);
}

/* ── guia de alinhamento da câmera ── */
function camGuideMarkup(){
  return `
    <div class="cam-wrap">
      <video id="camVideo" autoplay playsinline muted></video>
      <svg class="cam-mask" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs><mask id="gm"><rect width="100" height="100" fill="#fff"/><ellipse cx="50" cy="45" rx="26" ry="33" fill="#000"/></mask></defs>
        <rect width="100" height="100" fill="rgba(10,10,10,.6)" mask="url(#gm)"></rect>
      </svg>
      <div class="cam-ring" id="camRing"></div>
      <div class="cam-msg" id="camMsg">Centralize o rosto no oval</div>
      <button class="cam-shot" id="camShotBtn" title="Capturar agora">${IC.cam}</button>
    </div>
    <p class="cam-help">A foto é tirada automaticamente quando o rosto encaixa — ou toque no botão a qualquer momento.</p>`;
}
async function startCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:960}}});
    T.stream=s; T.mode="align"; T.holdStart=0;
    document.getElementById("tryCtrl").style.display="none";
    document.getElementById("tryStage").innerHTML=camGuideMarkup();
    const v=document.getElementById("camVideo"); v.muted=true; v.playsInline=true; v.srcObject=s;
    await v.play(); T.video=v; T.img=null;
    document.getElementById("camShotBtn").onclick=()=>capturePhoto();
    alignLoop();
  }catch(err){ toast("Não consegui acessar a câmera"); emptyTry(); }
}
async function alignLoop(){
  const fm=await getFM();
  if(!fm){
    const m=document.getElementById("camMsg"); if(m)m.textContent="Alinhe visualmente e toque para capturar";
    return;
  }
  const step=async()=>{
    if(!T.on||T.mode!=="align")return;
    if(T.video&&T.video.readyState>=2){ try{await fm.send({image:T.video});}catch(e){} }
    setTimeout(step,90);
  };
  step();
}
function markAlign(ok){
  const ring=document.getElementById("camRing"),msg=document.getElementById("camMsg");
  if(!ring)return;
  ring.classList.toggle("near",ok);
  const locked = ok && T.holdStart && (performance.now()-T.holdStart>250);
  ring.classList.toggle("locked",locked);
  if(msg)msg.textContent = locked ? "Perfeito — capturando..." : ok ? "Segure assim..." : "Centralize o rosto no oval";
}
function capturePhoto(){
  const v=T.video; if(!v||!v.videoWidth)return;
  const cv=document.createElement("canvas");
  cv.width=v.videoWidth; cv.height=v.videoHeight;
  const ctx=cv.getContext("2d");
  ctx.translate(cv.width,0); ctx.scale(-1,1); ctx.drawImage(v,0,0);
  const img=new Image();
  img.onload=()=>{
    stopCam();
    T.img=img; T.video=null; T.mode="photo"; T.auto=true;
    setStage(); detectPhoto();
  };
  img.src=cv.toDataURL("image/jpeg",.92);
}
function setStage(){
  document.getElementById("tryStage").innerHTML=`<canvas id="tryCanvas"></canvas>`;
  const cv=document.getElementById("tryCanvas");
  const sw=T.img.width, sh=T.img.height;
  const max=820; cv.width=Math.min(max,sw); cv.height=cv.width*(sh/sw);
  document.getElementById("tryCtrl").style.display="block";
  syncSliders(); makeDrag(cv); loopDraw();
}
/* FaceMesh */
async function getFM(){
  if(T.fm)return T.fm;
  if(typeof FaceMesh==="undefined")return null;
  const fm=new FaceMesh({locateFile:p=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${p}`});
  fm.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
  fm.onResults(onMesh); T.fm=fm; return fm;
}
function onMesh(res){
  if(!T.on)return;
  const lm=res.multiFaceLandmarks&&res.multiFaceLandmarks[0];
  if(T.mode==="align"){
    if(!lm){ T.holdStart=0; markAlign(false); return; }
    const L=lm[33],R=lm[263];
    const dx=R.x-L.x,dy=R.y-L.y;
    const cx=(L.x+R.x)/2, cy=(L.y+R.y)/2;
    const scale=Math.hypot(dx,dy)*2.15;
    const rot=Math.atan2(dy,dx);
    const ok=Math.abs(cx-0.5)<0.09 && Math.abs(cy-0.45)<0.10 && scale>0.30 && scale<0.62 && Math.abs(rot)<0.20;
    if(ok){ if(!T.holdStart)T.holdStart=performance.now(); }
    else T.holdStart=0;
    markAlign(ok);
    if(ok && T.holdStart && performance.now()-T.holdStart>550){ T.holdStart=0; capturePhoto(); }
    return;
  }
  if(!T.auto||!lm)return;
  const L=lm[33],R=lm[263];
  const dx=R.x-L.x,dy=R.y-L.y;
  T.t.cx=(L.x+R.x)/2; T.t.cy=(L.y+R.y)/2;
  T.t.scale=Math.hypot(dx,dy)*2.15; T.t.rot=Math.atan2(dy,dx);
  syncSliders(); status(false);
  if(T.mode==="photo") repaint();
}
async function detectPhoto(){
  status(true,"lendo o rosto");
  const fm=await getFM();
  if(!fm){status(false);T.auto=false;repaint();toast("Ajuste manual: arraste a armação");return;}
  try{await fm.send({image:T.img});}catch(e){T.auto=false;}
  status(false); repaint();
}
function status(on,txt){
  const s=document.getElementById("tryStatus"); if(!s)return;
  if(on){s.innerHTML=`<span class="sp"></span>${txt||"processando"}`;s.classList.add("on");}
  else s.classList.remove("on");
}
/* contorno vetorial simples usado só no provador — SVG puro
   (compatível com iOS/Safari, ao contrário de foreignObject) */
let fCache={k:null,img:null};
function frameSVGflat(shape,cor){
  const s=SHAPES[shape]||SHAPES.retangular;
  const W=s.w,H=s.h,rw=s.rw,BR=26,TOT=W*2+BR,i=rw/2;
  const lens="rgba(150,185,205,.30)";
  const st=`fill="${lens}" stroke="${cor}" stroke-width="${rw}" stroke-linejoin="round"`;
  const shapeAt=x=>{
    switch(shape){
      case "redonda":
        return `<ellipse cx="${x+W/2}" cy="${H/2}" rx="${(W-rw)/2}" ry="${(H-rw)/2}" ${st}/>`;
      case "hexagonal":{
        const p=[[.5,0],[1,.26],[1,.74],[.5,1],[0,.74],[0,.26]]
          .map(([a,b])=>`${(x+i+a*(W-rw)).toFixed(1)},${(i+b*(H-rw)).toFixed(1)}`).join(" ");
        return `<polygon points="${p}" ${st}/>`;}
      case "gatinho":{
        const L=x+i,R=x+W-i,T=i,B=H-i,up=(a,b)=>`${a.toFixed(1)},${b.toFixed(1)}`;
        return `<path d="M${up(L,T+(B-T)*.42)} Q${up(L+(R-L)*.06,T-(B-T)*.16)} ${up(L+(R-L)*.46,T+(B-T)*.06)}
          Q${up(R,T+(B-T)*.22)} ${up(R,T+(B-T)*.5)} Q${up(R-(R-L)*.1,B)} ${up(L+(R-L)*.42,B)}
          Q${up(L,B-(B-T)*.12)} ${up(L,T+(B-T)*.42)} Z" ${st}/>`;}
      case "aviador":{
        const L=x+i,R=x+W-i,T=i,B=H-i;
        return `<path d="M${L},${T+(B-T)*.16} Q${(L+R)/2},${T-(B-T)*.06} ${R},${T+(B-T)*.16}
          Q${R-(R-L)*.06},${B-(B-T)*.1} ${(L+R)/2+(R-L)*.06},${B}
          Q${L+(R-L)*.08},${B-(B-T)*.12} ${L},${T+(B-T)*.16} Z" ${st}/>`;}
      case "quadrada":
        return `<rect x="${x+i}" y="${i}" width="${W-rw}" height="${H-rw}" rx="7" ${st}/>`;
      default:
        return `<rect x="${x+i}" y="${i}" width="${W-rw}" height="${H-rw}" rx="16" ${st}/>`;
    }
  };
  const by=H*0.30+rw/2;
  const bridge=`<path d="M${W-i} ${by} q${BR/2} ${-rw*0.9} ${BR+rw} 0" stroke="${cor}" stroke-width="${rw}" fill="none" stroke-linecap="round"/>`;
  const stubs=`<path d="M${i} ${by} L${-rw*0.6} ${by-rw*0.7}" stroke="${cor}" stroke-width="${rw}" stroke-linecap="round"/>
               <path d="M${TOT-i} ${by} L${TOT+rw*0.6} ${by-rw*0.7}" stroke="${cor}" stroke-width="${rw}" stroke-linecap="round"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${TOT+rw*2}" height="${H+rw}" viewBox="${-rw} ${-rw/2} ${TOT+rw*2} ${H+rw}">
    ${shapeAt(0)}${bridge}${shapeAt(W+BR)}${stubs}</svg>`;
}
function frameImg(cb){
  const k=T.prod.shape+"|"+T.prod.cor;
  if(fCache.k===k&&fCache.img)return cb(fCache.img);
  const img=new Image();
  img.onload=()=>{fCache={k,img};cb(img);};
  img.onerror=()=>cb(null);
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(frameSVGflat(T.prod.shape,T.prod.cor));
}

function loopDraw(){
  cancelAnimationFrame(T.raf);
  const cv=document.getElementById("tryCanvas"); if(!cv||!T.img)return;
  const ctx=cv.getContext("2d");
  ctx.drawImage(T.img,0,0,cv.width,cv.height);
  frameImg(img=>{ if(img) place(ctx,cv,img); });
}
function place(ctx,cv,img){
  const px=T.t.cx*cv.width, py=T.t.cy*cv.height;
  const fw=T.t.scale*cv.width, fh=fw*(img.height/img.width);
  ctx.save();ctx.translate(px,py);ctx.rotate(T.t.rot);
  ctx.drawImage(img,-fw/2,-fh/2,fw,fh);ctx.restore();
}
function repaint(){
  const cv=document.getElementById("tryCanvas"); if(!cv||!T.img)return;
  const ctx=cv.getContext("2d");
  ctx.drawImage(T.img,0,0,cv.width,cv.height);
  frameImg(img=>{ if(img) place(ctx,cv,img); });
}
function makeDrag(cv){
  let d=false;
  const rel=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width,y:(p.clientY-r.top)/r.height};};
  cv.addEventListener("mousedown",()=>{d=true;T.auto=false;});
  cv.addEventListener("touchstart",()=>{d=true;T.auto=false;},{passive:true});
  const mv=e=>{if(!d)return;const{x,y}=rel(e);T.t.cx=x;T.t.cy=y;syncSliders();repaint();e.preventDefault();};
  window.addEventListener("mousemove",mv);window.addEventListener("touchmove",mv,{passive:false});
  window.addEventListener("mouseup",()=>d=false);window.addEventListener("touchend",()=>d=false);
}
function syncSliders(){
  const a=document.getElementById("szR"),b=document.getElementById("psR");
  if(a)a.value=T.t.scale; if(b)b.value=T.t.cy;
}
function drawChips(){
  const el=document.getElementById("tryFrames");
  el.innerHTML=PRODUTOS.map(p=>`
    <div class="tchip ${T.prod&&T.prod.id===p.id?"on":""}" data-tf="${p.id}">
      <div class="tm"><img src="${fotoUrl(p,p.capa)}" alt="${p.marca} ${p.nome}"></div>
      <div class="tn">${p.marca} ${p.nome}</div><div class="tp">${BRL(p.preco)}</div>
    </div>`).join("");
  el.querySelectorAll("[data-tf]").forEach(c=>c.onclick=()=>{
    T.prod=PRODUTOS.find(p=>p.id===c.dataset.tf);
    fCache={k:null,img:null}; drawChips(); if(T.mode==="photo")repaint();
  });
}

/* ═══════════ MARKUP FIXO ═══════════ */
function injectFixed(){
  const d=document.createElement("div");
  d.innerHTML=`
    <div class="ov" id="cartOv"></div><div class="ov" id="modalOv"></div>
    <aside class="drawer" id="cartDr">
      <div class="dr-head"><h3>Sacola</h3><button class="xbtn" id="cartX">${IC.x}</button></div>
      <div class="dr-body" id="cartBody"></div>
      <div class="dr-foot" id="cartFoot"></div>
    </aside>
    <div class="modal" id="cfgModal"></div>
    <div class="tryon" id="tryOn">
      <div class="t-head">
        <div class="tt"><span class="eye"></span><div><b>Provador virtual</b><span>Íris óptica</span></div></div>
        <button class="xbtn" id="tryX" style="color:var(--paper)">${IC.x}</button>
      </div>
      <div class="t-stage" id="tryStage"></div>
      <div class="t-status" id="tryStatus"></div>
      <div class="t-ctrl" id="tryCtrl" style="display:none">
        <div class="t-frames" id="tryFrames"></div>
        <div class="t-tools">
          <div class="tl">tamanho <input type="range" id="szR" min="0.26" max="0.66" step="0.004"></div>
          <div class="tl">altura <input type="range" id="psR" min="0.26" max="0.68" step="0.004"></div>
          <button class="tbtn" id="autoB">${IC.rot} Auto-ajuste</button>
          <button class="tbtn" id="newB">${IC.up} Outra foto</button>
          <button class="tbtn go" id="pickB">${IC.glasses} Escolher grau</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(d);
  document.getElementById("cartX").onclick=closeCart;
  document.getElementById("cartOv").onclick=closeCart;
  document.getElementById("modalOv").onclick=closeCfg;
  document.getElementById("tryX").onclick=closeTry;
  document.getElementById("szR").oninput=e=>{T.auto=false;T.t.scale=+e.target.value;repaint();};
  document.getElementById("psR").oninput=e=>{T.auto=false;T.t.cy=+e.target.value;repaint();};
  document.getElementById("autoB").onclick=()=>{T.auto=true;if(T.mode==="photo")detectPhoto();toast("Auto-ajuste ligado");};
  document.getElementById("newB").onclick=()=>{stopCam();T.img=null;T.video=null;T.mode=null;emptyTry();};
  document.getElementById("pickB").onclick=()=>{const id=T.prod.id;closeTry();openCfg(id);};
}

/* ═══════════ TOAST ═══════════ */
let tTimer;
function toast(txt){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}
  t.innerHTML=`${IC.check}${txt}`;
  requestAnimationFrame(()=>t.classList.add("on"));
  clearTimeout(tTimer); tTimer=setTimeout(()=>t.classList.remove("on"),2400);
}

/* ═══════════ ANIMAÇÕES DE PÁGINA ═══════════ */
let io;
function observeReveal(){
  if(!io) io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12,rootMargin:"0px 0px -60px"});
  document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el));
}
function counters(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const end=+el.dataset.count; let s=null;
    const run=ts=>{ if(!s)s=ts; const p=Math.min(1,(ts-s)/1400);
      el.textContent=Math.round(end*(1-Math.pow(1-p,3)));
      if(p<1)requestAnimationFrame(run); };
    requestAnimationFrame(run);
  });
}
function bindTop(){
  document.getElementById("navTry").onclick=()=>openTry();
  document.getElementById("navCart").onclick=openCart;
  document.getElementById("heroTry").onclick=()=>openTry();
  document.getElementById("bandTry").onclick=()=>openTry();
  const ft=document.getElementById("footTry"); if(ft)ft.onclick=e=>{e.preventDefault();openTry();};
  badge();
}
/* nav some ao descer, volta ao subir */
function navScroll(){
  let last=0;const w=document.getElementById("navWrap");
  addEventListener("scroll",()=>{
    const y=scrollY;
    w.classList.toggle("hide", y>last && y>240);
    last=y;
  },{passive:true});
}
/* MediaPipe (assíncrono, não bloqueia) */
function loadFM(){
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js";
  s.crossOrigin="anonymous"; document.head.appendChild(s);
}

/* Performance: pausa animações quando a aba está oculta. */
function perfGuards(){
  document.addEventListener("visibilitychange",()=>{
    document.documentElement.classList.toggle("tab-hidden", document.hidden);
  });
}

/* ═══════════ INIT ═══════════ */
renderApp();
injectFixed();
loadFM();
observeReveal();
navScroll();
perfGuards();
syncCatalogoRemoto();
addEventListener("load",()=>{
  setTimeout(()=>{document.getElementById("loader").classList.add("done");counters();},650);
});
setTimeout(()=>{const l=document.getElementById("loader");if(l&&!l.classList.contains("done")){l.classList.add("done");counters();}},2600);
addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(T.on)return closeTry();
  if(document.getElementById("cfgModal").classList.contains("on"))return closeCfg();
  if(document.getElementById("cartDr").classList.contains("on"))return closeCart();
});

</script>
</body>
